
name: Android build

on:
  workflow_dispatch:
  push:
    branches:
      - master
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: android-${{ github.event_name == 'release' && github.ref || 'nightly' }}
  cancel-in-progress: false

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Alexandria
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract engine version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_EVENT_NAME" == "release" ]]; then
            VERSION="$RELEASE_TAG"
          else
            VERSION="$(git describe --tags --always 2>/dev/null || echo "dev-${GITHUB_SHA::7}")"
          fi

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Building Alexandria $VERSION"

      - name: Install Android NDK
        shell: bash
        run: |
          set -euo pipefail

          NDK_VERSION=r27c
          curl --fail --location --retry 3 \
            "https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip" \
            -o ndk.zip

          unzip -q ndk.zip
          echo "ANDROID_NDK_HOME=$PWD/android-ndk-${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Download and verify NNUE network
        shell: bash
        run: |
          set -euo pipefail

          URL="https://github.com/PGG106/Alexandria-networks/releases/latest/download/nn.net"

          curl --fail --location --retry 5 --retry-all-errors \
            --connect-timeout 30 \
            "$URL" -o nn.net

          test -s nn.net

          SIZE="$(stat -c '%s' nn.net)"
          EXPECTED_SIZE=157159968

          echo "Downloaded network size: $SIZE bytes"
          echo "Expected minimum size: $EXPECTED_SIZE bytes"

          if (( SIZE < EXPECTED_SIZE )); then
            echo "::error::Network is incomplete or incompatible: $SIZE bytes"
            exit 1
          fi

          if [[ ! -s net-hash.txt ]]; then
            echo "::error::net-hash.txt is missing or empty"
            exit 1
          fi

          EXPECTED_HASH="$(tr -d '[:space:]' < net-hash.txt)"
          ACTUAL_HASH="$(sha256sum nn.net | awk '{print $1}')"

          echo "Expected SHA-256: $EXPECTED_HASH"
          echo "Actual SHA-256:   $ACTUAL_HASH"

          if [[ "$ACTUAL_HASH" != "$EXPECTED_HASH" ]]; then
            echo "::error::Downloaded network does not match this Alexandria source revision."
            echo "::error::Use the exact network associated with net-hash.txt."
            exit 1
          fi

          echo "Network verification passed."

      - name: Patch Makefile for Android cross-compilation
        shell: bash
        run: |
          set -euo pipefail

          sed -i 's/-march=native -E -dM -/-E -dM -/' makefile

      - name: Patch constexpr rounding for Clang
        shell: bash
        run: |
          set -euo pipefail

          if ! grep -q 'constexpr_round' src/nnue.h; then
            sed -i '/#pragma once/a constexpr double constexpr_round(double x) { return x >= 0.0 ? (double)(long long)(x + 0.5) : (double)(long long)(x - 0.5); }' src/nnue.h
            sed -i 's/std::round(/constexpr_round(/g' src/nnue.h
          fi

      - name: Build host network preprocessor
        shell: bash
        run: |
          set -euo pipefail

          make -C tools clean
          make -C tools \
            CXX=g++ \
            CXXFLAGS="-funroll-loops -O3 -std=c++23 -DNDEBUG" \
            NATIVE=

          test -x tools/preprocess

      - name: Preprocess and verify network
        shell: bash
        run: |
          set -euo pipefail

          rm -f processed.net
          ./tools/preprocess nn.net processed.net

          test -s processed.net
          echo "Preprocessed network:"
          stat -c '%n: %s bytes' processed.net

      - name: Build Android ARM64
        shell: bash
        run: |
          set -euo pipefail

          export CXX="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android28-clang++"

          make -j2 build=arm64 \
            CXX="$CXX" \
            NATIVE="-march=armv8-a" \
            CXXFLAGS="-funroll-loops -O3 -fno-exceptions -std=c++23 -DNDEBUG -DEVALFILE=\"processed.net\" --target=aarch64-linux-android28 -static-libstdc++" \
            Alexandria

          mv Alexandria "Alexandria-${VERSION}-android-arm64-v8a"

      - name: Build Android ARM64 DotProd
        shell: bash
        run: |
          set -euo pipefail

          rm -rf .tmp Alexandria

          export CXX="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android28-clang++"

          make -j2 build=arm64 \
            CXX="$CXX" \
            NATIVE="-march=armv8.2-a+dotprod" \
            CXXFLAGS="-funroll-loops -O3 -fno-exceptions -std=c++23 -DNDEBUG -DEVALFILE=\"processed.net\" --target=aarch64-linux-android28 -static-libstdc++" \
            Alexandria

          mv Alexandria "Alexandria-${VERSION}-android-arm64-dotprod"

      - name: Verify Android binaries
        shell: bash
        run: |
          set -euo pipefail

          for FILE in Alexandria-"${VERSION}"-android-*; do
            test -s "$FILE"
            file "$FILE"
            ls -lh "$FILE"
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: alexandria-${{ env.VERSION }}-android-binaries
          retention-days: 30
          if-no-files-found: error
          path: |
            Alexandria-${{ env.VERSION }}-android-arm64-v8a
            Alexandria-${{ env.VERSION }}-android-arm64-dotprod

      - name: Publish rolling prerelease
        if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view android-nightly >/dev/null 2>&1; then
            gh release delete android-nightly --cleanup-tag --yes
          fi

          gh release create android-nightly \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Alexandria ${VERSION} (Android)" \
            --notes "Built from ${GITHUB_SHA} on ${GITHUB_REF_NAME}" \
            "Alexandria-${VERSION}-android-arm64-v8a" \
            "Alexandria-${VERSION}-android-arm64-dotprod"

      - name: Attach binaries to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          set -euo pipefail

          gh release upload "$RELEASE_TAG" \
            "Alexandria-${VERSION}-android-arm64-v8a" \
            "Alexandria-${VERSION}-android-arm64-dotprod" \
            --clobber
