
name: Android build

on:
  workflow_dispatch:
  push:
    branches:
      - master
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: android-${{ github.event_name == 'release' && github.ref || 'nightly' }}
  cancel-in-progress: false

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout Alexandria
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract engine version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_EVENT_NAME" == "release" ]]; then
            VERSION="$RELEASE_TAG"
          else
            VERSION="$(git describe --tags --always 2>/dev/null || echo "dev-${GITHUB_SHA::7}")"
          fi

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Building Alexandria $VERSION"

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            curl unzip jq g++ make file

      - name: Install Android NDK
        shell: bash
        run: |
          set -euo pipefail

          NDK_VERSION=r26d

          curl --fail --location --retry 3 \
            "https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip" \
            -o ndk.zip

          unzip -q ndk.zip
          echo "ANDROID_NDK_HOME=$PWD/android-ndk-${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Find the exact matching NNUE network
        shell: bash
        run: |
          set -euo pipefail

          test -s net-hash.txt

          EXPECTED_HASH="$(tr -d '[:space:]' < net-hash.txt)"
          EXPECTED_HASH="${EXPECTED_HASH^^}"

          if [[ ! "$EXPECTED_HASH" =~ ^[0-9A-F]{64}$ ]]; then
            echo "::error::net-hash.txt does not contain a valid SHA-256 hash"
            exit 1
          fi

          echo "Required network SHA-256: $EXPECTED_HASH"

          API="https://api.github.com/repos/PGG106/Alexandria-networks/releases?per_page=100"

          curl --fail --location --retry 5 \
            -H "Accept: application/vnd.github+json" \
            "$API" -o releases.json

          MATCHED=false

          while IFS=$'\t' read -r TAG URL; do
            [[ -n "$URL" ]] || continue

            echo "Checking network release: $TAG"

            if ! curl --fail --location --silent --show-error \
              --retry 2 "$URL" -o candidate.nnue; then
              echo "Download failed for $TAG; trying next release."
              continue
            fi

            ACTUAL_HASH="$(sha256sum candidate.nnue | awk '{print toupper($1)}')"
            SIZE="$(stat -c '%s' candidate.nnue)"

            echo "Release: $TAG"
            echo "Size: $SIZE bytes"
            echo "SHA-256: $ACTUAL_HASH"

            if [[ "$ACTUAL_HASH" == "$EXPECTED_HASH" ]]; then
              mv candidate.nnue nn.net
              echo "Matched network release: $TAG"
              MATCHED=true
              break
            fi

            rm -f candidate.nnue
          done < <(
            jq -r '
              .[]
              | .tag_name as $tag
              | .assets[]
              | select(.name == "nn.net")
              | [$tag, .browser_download_url]
              | @tsv
            ' releases.json
          )

          if [[ "$MATCHED" != true ]]; then
            echo "::error::No nn.net asset among the first 100 releases matches net-hash.txt."
            echo "::error::Do not bypass the hash check. Check the network release history and asset filenames."
            exit 1
          fi

          test -s nn.net
          sha256sum nn.net

      - name: Patch Makefile for Android cross-compilation
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/-march=native -E -dM -/-E -dM -/' makefile

      - name: Patch constexpr rounding for Clang
        shell: bash
        run: |
          set -euo pipefail

          if ! grep -q 'constexpr_round' src/nnue.h; then
            sed -i '/#pragma once/a constexpr double constexpr_round(double x) { return x >= 0.0 ? (double)(long long)(x + 0.5) : (double)(long long)(x - 0.5); }' src/nnue.h
            sed -i 's/std::round(/constexpr_round(/g' src/nnue.h
          fi

      - name: Build host network preprocessor
        shell: bash
        run: |
          set -euo pipefail

          g++ -funroll-loops -O3 -fno-exceptions \
            -std=c++23 -DNDEBUG \
            -o tools/preprocess tools/preprocess.cpp -pthread

          test -x tools/preprocess

      - name: Preprocess and verify network
        shell: bash
        run: |
          set -euo pipefail

          rm -f processed.net

          ./tools/preprocess nn.net processed.net

          test -s processed.net
          stat -c '%n: %s bytes' processed.net

      - name: Build Alexandria ARM64 v8-A
        shell: bash
        run: |
          set -euo pipefail

          export CXX="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android28-clang++"

          make -j2 build=arm64 \
            CXX="$CXX" \
            NATIVE="-march=armv8-a" \
            CXXFLAGS="-funroll-loops -O3 -fno-exceptions -std=c++23 -DNDEBUG -DEVALFILE=\"processed.net\" --target=aarch64-linux-android28 -static-libstdc++" \
            Alexandria

          mv Alexandria "Alexandria-${VERSION}-android-arm64-v8a"

      - name: Build Alexandria ARM64 DotProd
        shell: bash
        run: |
          set -euo pipefail

          rm -rf .tmp Alexandria

          export CXX="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android28-clang++"

          make -j2 build=arm64 \
            CXX="$CXX" \
            NATIVE="-march=armv8.2-a+dotprod" \
            CXXFLAGS="-funroll-loops -O3 -fno-exceptions -std=c++23 -DNDEBUG -DEVALFILE=\"processed.net\" --target=aarch64-linux-android28 -static-libstdc++" \
            Alexandria

          mv Alexandria "Alexandria-${VERSION}-android-arm64-dotprod"

      - name: Verify Android binaries
        shell: bash
        run: |
          set -euo pipefail

          for BIN in Alexandria-"${VERSION}"-android-*; do
            test -s "$BIN"
            file "$BIN"
            ls -lh "$BIN"
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: alexandria-${{ env.VERSION }}-android-binaries
          retention-days: 30
          if-no-files-found: error
          path: |
            Alexandria-${{ env.VERSION }}-android-arm64-v8a
            Alexandria-${{ env.VERSION }}-android-arm64-dotprod

      - name: Publish rolling prerelease
        if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view android-nightly >/dev/null 2>&1; then
            gh release delete android-nightly --cleanup-tag --yes
          fi

          gh release create android-nightly \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Alexandria ${VERSION} (Android)" \
            --notes "Built from ${GITHUB_SHA} on ${GITHUB_REF_NAME}" \
            "Alexandria-${VERSION}-android-arm64-v8a" \
            "Alexandria-${VERSION}-android-arm64-dotprod"

      - name: Attach binaries to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          set -euo pipefail

          gh release upload "$RELEASE_TAG" \
            "Alexandria-${VERSION}-android-arm64-v8a" \
            "Alexandria-${VERSION}-android-arm64-dotprod" \
            --clobber
